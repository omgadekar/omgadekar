<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-labelledby="ps-title"><title id="ps-title">omgadekar/Til repository</title><desc>A wallpaper that counts down. (written in Kotlin, 0 stars, 0 forks)</desc><defs><clipPath id="ps-clip"><rect width="400" height="200" rx="16"/></clipPath><radialGradient id="ps-glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#8B7CFF" stop-opacity="0.248"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient><linearGradient id="rp-accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#3EC6E0"/></linearGradient><style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}.fade{animation:ps-fade .6s ease-out backwards}@keyframes ps-fade{from{opacity:0}}.up{animation:ps-up .7s cubic-bezier(.2,.7,.2,1) backwards}@keyframes ps-up{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}.rp-bar{transform-box:fill-box;transform-origin:left;animation:rp-grow 1.1s cubic-bezier(.2,.7,.2,1) backwards}@keyframes rp-grow{from{transform:scaleX(0)}}</style></defs><g clip-path="url(#ps-clip)"><rect width="400" height="200" fill="#11141D"/><rect width="400" height="200" fill="url(#ps-glow)"/></g><g clip-path="url(#ps-clip)"><rect class="rp-bar" width="400" height="3" fill="url(#rp-accent)"/></g><g class="fade"><text x="24" y="40" class="mono" font-size="12" letter-spacing="1.4" fill="#3EC6E0">KOTLIN</text></g><text class="sans up" style="animation-delay:0.05s" x="24" y="72" font-size="20" font-weight="700" letter-spacing="-.3"><tspan fill="#E6E8F0">Til</tspan></text><g class="up" style="animation-delay:0.12s"><text x="24" y="104" class="sans" font-size="13.5" fill="#8B93A7">A wallpaper that counts down.</text></g><g class="fade" style="animation-delay:0.2s"><line x1="24" y1="164" x2="376" y2="164" stroke="#232838"/><circle cx="30" cy="182" r="5.5" fill="#A97BFF"/><text x="42" y="186.5" class="mono" font-size="12.5" fill="#E6E8F0">Kotlin</text><g transform="translate(111 182) scale(0.82)" fill="none" stroke="#8B93A7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -6.6L1.82 -1.91L6.85 -1.62L2.95 1.56L4.23 6.42L0 3.7L-4.23 6.42L-2.95 1.56L-6.85 -1.62L-1.82 -1.91Z"/></g><text x="122" y="186.5" class="mono" font-size="12.5" fill="#8B93A7">0</text><g transform="translate(151.5 182) scale(0.82)" fill="none" stroke="#8B93A7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="-4" cy="-4.6" r="1.9"/><circle cx="4" cy="-4.6" r="1.9"/><circle cx="0" cy="4.8" r="1.9"/><path d="M-4-2.7V-1.4Q-4 .6-2 .6H2Q4 .6 4-1.4V-2.7M0 .6V2.9"/></g><text x="162.5" y="186.5" class="mono" font-size="12.5" fill="#8B93A7">0</text><g transform="translate(294 182) scale(0.72)" fill="none" stroke="#8B93A7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="6.6"/><path d="M0-3.6V0L2.6 1.8"/></g><text x="376" y="186.5" text-anchor="end" class="mono" font-size="12" fill="#8B93A7">6 days ago</text></g><rect x=".5" y=".5" width="399" height="199" rx="16" fill="none" stroke="#232838"/></svg>
